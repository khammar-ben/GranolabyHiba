name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Valeurs factices : le build ne contacte pas Supabase
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
          VITE_SITE_URL: https://example.com
      - name: Aucun secret dans le build
        run: |
          if grep -rEq "sb_secret_[A-Za-z0-9_-]{8}|postgres(ql)?://[^:/@ ]+:[^@ ]+@" dist; then
            echo "Secret détecté dans dist/" && exit 1
          fi
